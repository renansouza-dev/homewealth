spring:
  application:
    name: transactions
  datasource:
    url: jdbc:postgresql://localhost:5432/transactions
    username: transactions
    password: transactions

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs