# Grafana LGTM — unified observability stack (Loki, Grafana, Tempo, Mimir).
# Exposes OTLP HTTP on :4318 for traces, metrics, and logs.
# UI available at http://<minikube-ip>:30300 via the NodePort service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: shared
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/otel-lgtm:0.25.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            runAsNonRoot: true
            supplementalGroups:
              - 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000  # Grafana UI
            - containerPort: 4318  # OTLP HTTP (traces, metrics, logs)
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: grafana-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
            - name: lgtm-dir
              mountPath: /etc/lgtm
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: tmp-dir
          emptyDir: { }
        - name: lgtm-dir
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: shared
spec:
  selector:
    app: grafana
  ports:
    - name: ui
      port: 3000
      targetPort: 3000
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
# NodePort — exposes the Grafana UI for local browser access via Minikube.
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: shared
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: ui
      port: 3000
      targetPort: 3000
      nodePort: 30300