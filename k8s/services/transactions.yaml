# Transactions service — core business API.
# Depends on postgres and grafana in the `shared` namespace.
# Image must be loaded into Minikube before deploying:
#   minikube image load homewealth/transactions:1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
  namespace: services
  labels:
    app: transactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      automountServiceAccountToken: false
      containers:
        - name: transactions
          image: homewealth/transactions:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres.shared.svc.cluster.local:5432/transactions"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: "http://grafana.shared.svc.cluster.local:4318/v1/metrics"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana.shared.svc.cluster.local:4318/v1/traces"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: "http://grafana.shared.svc.cluster.local:4318/v1/logs"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transactions
  namespace: services
spec:
  selector:
    app: transactions
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-nodeport
  namespace: services
spec:
  type: NodePort
  selector:
    app: transactions
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081