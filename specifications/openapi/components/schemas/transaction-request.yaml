type: object
required:
  - brokerId
  - portfolioId
  - assetId
  - operationDate
  - operationType
  - quantity
  - unitPrice
properties:
  brokerId:
    type: string
    format: uuid
    description: Broker identifier
    example: 20db4dc0-c0ff-4c0e-b2ab-fa770487d28e
  portfolioId:
    type: string
    description: Portfolio identifier
    format: uuid
    example: c5fbe7bf-1c29-4d56-8496-9ee6a33d597d
  assetId:
    type: string
    description: Asset identifier
    minLength: 5
    maxLength: 6
    example: ASSE4
  operationDate:
    type: string
    format: date
    description: Date and time of the operation
    example: "2026-01-18"
  operationType:
    $ref: 'operation-type.yaml'
  quantity:
    type: integer
    format: int32
    minimum: 1
    description: Quantity of assets
    example: 100
  unitPrice:
    type: number
    format: double
    minimum: 0
    description: Price per unit
    example: 27.35